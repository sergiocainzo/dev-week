Spring:
  # configuração DataSource
  datasource:
    url: jdbc:h2:mem:sdw2025
    username: sdw2025
    password:

  # Configuração JPA
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      dll-auto: create # validate | update | crete | crete-drop
    properties:
      hibernate:
        format_sql: true

  # Configuração do H2
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false